; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; Windows MAX_PATH (260 chars) breaks extraction of the espressif32
; framework's bundled Matter/connectedhomeip sources under the default
; ~/.platformio path. Redirect to a short path instead.
core_dir = C:\pio
; a plain `pio run` builds only the firmware; the native env is for `pio test`
default_envs = coolant_temp

; Host-native environment for unit testing hardware-free logic (see
; lib/GaugeLogic) without any board, emulator, or toolchain download.
; Run with: platformio.exe test -e native
[env:native]
platform = native
test_framework = unity

; Settings shared by every gauge firmware build
[gauge_firmware]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc1-n8r8
framework = arduino
lib_deps = lvgl/lvgl@9.5.0
monitor_speed = 115200
build_flags =
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -DLV_CONF_PATH="\"${PROJECT_DIR}/include/lv_conf.h\""

; One environment per gauge; see include/gauge_config.h
[env:coolant_temp]
extends = gauge_firmware
build_flags =
  ${gauge_firmware.build_flags}
  -D GAUGE_TYPE=GAUGE_COOLANT_TEMP

; Coolant gauge reading the CAN bus instead of simulated data
[env:coolant_temp_can]
extends = gauge_firmware
build_flags =
  ${env:coolant_temp.build_flags}
  -D USE_REAL_CAN

[env:oil_temp]
extends = gauge_firmware
build_flags =
  ${gauge_firmware.build_flags}
  -D GAUGE_TYPE=GAUGE_OIL_TEMP

; CAN version uses a placeholder message; see include/gauge_config.h
[env:oil_temp_can]
extends = gauge_firmware
build_flags =
  ${env:oil_temp.build_flags}
  -D USE_REAL_CAN

[env:oil_pressure]
extends = gauge_firmware
build_flags =
  ${gauge_firmware.build_flags}
  -D GAUGE_TYPE=GAUGE_OIL_PRESSURE

; CAN version uses a placeholder message; see include/gauge_config.h
[env:oil_pressure_can]
extends = gauge_firmware
build_flags =
  ${env:oil_pressure.build_flags}
  -D USE_REAL_CAN