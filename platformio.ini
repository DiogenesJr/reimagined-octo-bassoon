; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; Windows MAX_PATH (260 chars) breaks extraction of the espressif32
; framework's bundled Matter/connectedhomeip sources under the default
; ~/.platformio path. Redirect to a short path instead.
core_dir = C:\pio

; Host-native environment for unit testing hardware-free logic (see
; lib/GaugeLogic) without any board, emulator, or toolchain download.
; Run with: platformio.exe test -e native
[env:native]
platform = native
test_framework = unity

[env:esp32-s3-devkitc1-n8r8]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc1-n8r8
framework = arduino
lib_deps = lvgl/lvgl@^9.3.0
monitor_speed = 115200
build_flags =
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -DLV_CONF_PATH="\"${PROJECT_DIR}/include/lv_conf.h\""